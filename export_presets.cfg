[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="builds/*, release/*, *.mp4"
export_path="builds/windows/UndergroundSprint.exe"

[preset.0.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
application/product_name="Underground Sprint"
application/company_name="One Humanity"

[preset.1]

name="macOS"
platform="macOS"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="builds/*, release/*, *.mp4"
export_path="builds/macos/UndergroundSprint.zip"

[preset.1.options]

binary_format/architecture="universal"
application/bundle_identifier="org.onehumanity.undergroundsprint"
application/name="Underground Sprint"
codesign/codesign=1

[preset.2]

name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="builds/*, release/*, *.mp4"
export_path="builds/linux/UndergroundSprint.x86_64"

[preset.2.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"

[preset.3]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter=""
exclude_filter="builds/*, release/*, *.mp4, tools/*"
export_path="builds/web/index.html"

[preset.3.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
