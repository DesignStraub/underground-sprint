html/head_include="<style>\n#fs-btn{position:fixed;top:10px;right:10px;z-index:10;width:42px;height:42px;padding:9px;border:1px solid rgba(110,215,255,.55);border-radius:9px;background:rgba(10,8,26,.6);cursor:pointer;opacity:.7}\n#fs-btn:hover{opacity:1}\n#fs-btn svg{width:100%;height:100%;display:block}\n</style>\n<script>\nwindow.addEventListener('DOMContentLoaded', function () {\n\tvar d = document, b = d.createElement('button');\n\tb.id = 'fs-btn';\n\tb.title = 'Vollbild / Fullscreen (F)';\n\tb.innerHTML = '<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#bfefff\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6\"/></svg>';\n\tb.addEventListener('click', function () {\n\t\ttry {\n\t\t\tvar e = d.documentElement;\n\t\t\tif (d.fullscreenElement || d.webkitFullscreenElement) {\n\t\t\t\t(d.exitFullscreen || d.webkitExitFullscreen).call(d);\n\t\t\t} else {\n\t\t\t\tvar r = (e.requestFullscreen || e.webkitRequestFullscreen).call(e);\n\t\t\t\tif (r && r.catch) r.catch(function () {});\n\t\t\t}\n\t\t} catch (x) {}\n\t\tvar c = d.getElementById('canvas');\n\t\tif (c) c.focus();\n\t});\n\td.body.appendChild(b);\n\tvar upd = function () { b.style.display = (d.fullscreenElement || d.webkitFullscreenElement) ? 'none' : 'block'; };\n\td.addEventListener('fullscreenchange', upd);\n\td.addEventListener('webkitfullscreenchange', upd);\n});\n</script>"
progressive_web_app/enabled=false
